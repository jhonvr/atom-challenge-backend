name: Deploy Firebase Functions
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Build (TypeScript)
        run: npm run build

      - name: Deploy to Firebase Functions
        uses: w9jds/firebase-action@v13.16.0
        with:
          args: deploy --only functions,firestore:rules --project banckend-tasks
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BANCKEND_TASKS }}
